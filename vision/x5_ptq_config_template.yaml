# RDK X5 OpenExplorer PTQ configuration TEMPLATE
#
# IMPORTANT:
# 1. OpenExplorer versions may rename or regroup fields.
# 2. Treat this file as a teaching/reference template.
# 3. Compare it with the sample YAML shipped with YOUR installed version.
#
# Model preprocessing used during PyTorch training:
# RGB -> resize 224x224 -> /255 -> (x - mean) / std
#
# Calibration binaries generated by prepare_x5_calibration.py:
# RGB, CHW, float32, value range 0..255, NO normalization.

model_parameters:
  onnx_model: "lane_resnet18.onnx"
  march: "bayes-e"
  working_dir: "x5_build"
  output_model_file_prefix: "lane_resnet18_x5"

input_parameters:
  input_name: "images"
  input_type_train: "rgb"
  input_layout_train: "NCHW"
  input_shape: "1x3x224x224"

  # Keep runtime settings aligned with your real camera pipeline.
  # The exact field names/options depend on OpenExplorer version.
  input_type_rt: "rgb"
  input_layout_rt: "NCHW"

  # Training used torchvision:
  #   ToTensor() => divide by 255
  #   Normalize(mean, std)
  #
  # Equivalent:
  #   (x/255 - mean) / std
  #
  # For many OpenExplorer versions this is represented by mean/scale fields.
  # Verify the exact semantics in YOUR installed version before conversion.
  norm_type: "data_mean_and_scale"
  mean_value: "123.675 116.28 103.53"
  scale_value: "0.01712475 0.01750700 0.01742919"

calibration_parameters:
  cal_data_dir: "ptq/calibration_rgb_f32"
  calibration_type: "default"

compiler_parameters:
  compile_mode: "latency"
  debug: true
  optimize_level: "O3"
