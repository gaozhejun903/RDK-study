name: RDK-study smoke test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  vision-smoke:
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: vision/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r vision/requirements.txt

      - name: Run end-to-end smoke test
        run: |
          bash scripts/smoke_test.sh

      - name: Upload smoke-test logs and model artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-artifacts
          if-no-files-found: ignore
          path: |
            vision/train_meta.json
            vision/lane_resnet18.pt
            vision/lane_resnet18.onnx
