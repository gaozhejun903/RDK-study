name: Python static check

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Compile Python files
        run: |
          python -m compileall             ros2_ws/src/rdk_study_control/rdk_study_control             vision

      - name: Basic repository structure check
        run: |
          test -f README.md
          test -f docs/00_environment.md
          test -f docs/04_slam.md
          test -f docs/07_x5_ptq.md
          test -f vision/prepare_x5_calibration.py
          test -f vision/x5_ptq_config_template.yaml
